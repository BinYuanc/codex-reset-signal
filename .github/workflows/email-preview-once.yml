name: One-time email preview
on:
  push:
    paths:
      - .github/workflows/email-preview-once.yml
permissions:
  contents: read
jobs:
  send-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Send clearly labeled test email through Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          node <<'NODE'
          const { RESEND_API_KEY, EMAIL_FROM, EMAIL_TO } = process.env;
          if (!RESEND_API_KEY || !EMAIL_FROM || !EMAIL_TO) {
            console.error('Missing Resend email configuration');
            process.exit(1);
          }
          const recipients = EMAIL_TO.split(/[;,\n]/).map(s => s.trim()).filter(Boolean);
          const response = await fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + RESEND_API_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: EMAIL_FROM,
              to: recipients,
              subject: '【测试邮件】Codex 额度重置｜预告',
              html: '<!doctype html><html lang="zh-CN"><body style="font-family:Arial,sans-serif;max-width:600px;margin:24px auto;color:#202124;line-height:1.7"><h2>【测试】Codex 额度重置｜预告</h2><p>来源：@thsottiaux</p><ul><li>额度重置｜预告｜时间仅作测试演示</li></ul><p>这是模拟邮件，不代表发生了真实额度重置。实际通知会展示从原文提取的时间。</p><p>请以 Codex 额度页面为准。</p></body></html>',
              text: '【测试】Codex 额度重置｜预告\n额度重置｜预告｜时间仅作测试演示\n这是模拟邮件，不代表真实额度重置。'
            })
          });
          if (!response.ok) {
            console.error('Resend failed with HTTP ' + response.status);
            process.exit(1);
          }
          console.log('Test email accepted by Resend');
          NODE
